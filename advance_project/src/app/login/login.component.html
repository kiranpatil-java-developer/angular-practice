<div class="login-container">
  <h2 class="login-title">Login</h2>

  <table class="login-table">
    <tr>
      <td>Phone Number:</td>
      <td>
        <input
          type="text"
          placeholder="Enter phone number"
          [(ngModel)]="phoneNumber"
          class="login-input"
        />
      </td>
    </tr>

    <tr>
      <td>Password:</td>
      <td>
        <input
          type="password"
          placeholder="Enter password"
          [(ngModel)]="password"
          class="login-input"
        />
      </td>
    </tr>

    <tr>
      <td colspan="2" class="login-actions">
        <button class="login-button" (click)="loginChecks()">Login</button>
        <p *ngIf="errorMessage" class="error-message">
          {{ errorMessage }}
        </p>
      </td>
    </tr>
  </table>
</div>
