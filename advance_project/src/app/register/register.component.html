<div style="border: 1px solid #00a300; padding: 16px">
  <h2 style="text-align: center">Register Component</h2>

  <table>
    <tr>
      <td>Name:</td>
      <td>
        <input type="text" placeholder="Enter name" #name />
      </td>
    </tr>

    <tr>
      <td>Phone Number:</td>
      <td>
        <input type="text" placeholder="Enter phone number" #phone />
      </td>
    </tr>

    <tr>
      <td>Age:</td>
      <td>
        <input type="number" placeholder="Enter age" #age />
      </td>
    </tr>

    <tr>
      <td>Password:</td>
      <td>
        <input type="password" placeholder="Enter password" #password />
      </td>
    </tr>

    <tr>
      <td colspan="2" style="text-align: center">
        <button
          (click)="register(name.value, phone.value, age.value, password.value)"
        >
          Register
        </button>
      </td>
    </tr>

    <tr>
      <td colspan="2" style="text-align: center">
        <p *ngIf="error" style="color: red">{{ error }}</p>
        <p *ngIf="success" style="color: green">{{ success }}</p>
      </td>
    </tr>
  </table>
</div>
