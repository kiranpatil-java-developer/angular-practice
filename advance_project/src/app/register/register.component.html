<div style="border: 1px solid #00a300; padding: 16px">
  <h1 style="text-align: center; color: darkblue">Register</h1>

  <table>
    <tr>
      <td>Name:</td>
      <td>
        <input type="text" placeholder="Enter name" [(ngModel)]="name" />
      </td>
    </tr>

    <tr>
      <td>Phone Number:</td>
      <td>
        <input
          type="text"
          placeholder="Enter phone number"
          [(ngModel)]="phone"
        />
      </td>
    </tr>

    <tr>
      <td>Age:</td>
      <td>
        <input type="number" placeholder="Enter age" [(ngModel)]="age" />
      </td>
    </tr>

    <tr>
      <td>Password:</td>
      <td>
        <input
          type="password"
          placeholder="Enter password"
          [(ngModel)]="password"
        />
      </td>
    </tr>

    <tr>
      <td colspan="2" style="text-align: center">
        <button (click)="register()">Register</button>
      </td>
    </tr>

    <tr>
      <td colspan="2" style="text-align: center">
        <p *ngIf="error" style="color: red">{{ error }}</p>
        <p *ngIf="success" style="color: green">{{ success }}</p>
      </td>
    </tr>
  </table>
</div>
